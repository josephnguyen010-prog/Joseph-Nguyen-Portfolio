<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- SVG first for crisp rendering at any size; the .ico is the fallback for
         browsers that do not take SVG icons. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5000ca" />
    <meta
      name="description"
      content="Business Information Technology student at Virginia Tech - data, tech risk, and product. Founder of Venus, with projects in analytics, computer vision, and business analysis."
    />
    <meta name="author" content="Joseph Nguyen" />

    <!--
      Link preview cards, for when this URL is pasted into LinkedIn, a recruiter
      email, or an application form. These URLs are absolute on purpose:
      %PUBLIC_URL% resolves to a root-relative path, and the scrapers that build
      preview cards do not resolve relative URLs against the page they came
      from. If the canonical home ever moves off GitHub Pages, these four
      absolute URLs are what needs changing.
    -->
    <link rel="canonical" href="https://josephnguyen010-prog.github.io/Joseph-Nguyen-Portfolio/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joseph Nguyen" />
    <meta property="og:title" content="Joseph Nguyen - Data, Tech Risk &amp; Product" />
    <meta
      property="og:description"
      content="Business Information Technology student at Virginia Tech - data, tech risk, and product. Founder of Venus, with projects in analytics, computer vision, and business analysis."
    />
    <meta property="og:url" content="https://josephnguyen010-prog.github.io/Joseph-Nguyen-Portfolio/" />
    <meta property="og:image" content="https://josephnguyen010-prog.github.io/Joseph-Nguyen-Portfolio/og-image.jpg" />
    <!-- Stated explicitly so the card renders at full width on first scrape,
         before the crawler has fetched and measured the image itself. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joseph Nguyen's portfolio homepage" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joseph Nguyen - Data, Tech Risk &amp; Product" />
    <meta
      name="twitter:description"
      content="Business Information Technology student at Virginia Tech - data, tech risk, and product. Founder of Venus, with projects in analytics, computer vision, and business analysis."
    />
    <meta name="twitter:image" content="https://josephnguyen010-prog.github.io/Joseph-Nguyen-Portfolio/og-image.jpg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Joseph Nguyen - Data, Tech Risk &amp; Product</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
